<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omini Studio — Coming soon</title>
<meta name="description" content="Omini Studio turns narration audio into finished, synchronized explainer videos. Launching soon.">
<link rel="canonical" href="https://oministudio.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://oministudio.com/">
<meta property="og:title" content="Omini Studio — Coming soon">
<meta property="og:description" content="Turn your audio into a finished explainer video.">
<meta property="og:image" content="https://oministudio.com/demo-poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230d9488'/><circle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='3'/></svg>">
<script>
  // Apply the remembered colour scheme before first paint.
  try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}
</script>
<style>
  /* Tokens mirror the app stylesheet: slate + teal, light and dark. */
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --ink: #0f172a;
    --muted: #64748b;
    --primary: #0d9488;
    --link: #0f766e;
    --on-primary: #ffffff;
    --tint-teal: #ccfbf1;
    --video-bg: #0b1220;
    --topbar-bg: rgba(255, 255, 255, .9);
    --shadow: 0 8px 24px rgba(15, 23, 42, .08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220;
      --surface: #0f172a;
      --line: #1e293b;
      --line-strong: #334155;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --primary: #14b8a6;
      --link: #2dd4bf;
      --on-primary: #042f2e;
      --tint-teal: rgba(45, 212, 191, .16);
      --video-bg: #000000;
      --topbar-bg: rgba(11, 18, 32, .9);
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220;
    --surface: #0f172a;
    --line: #1e293b;
    --line-strong: #334155;
    --ink: #f8fafc;
    --muted: #94a3b8;
    --primary: #14b8a6;
    --link: #2dd4bf;
    --on-primary: #042f2e;
    --tint-teal: rgba(45, 212, 191, .16);
    --video-bg: #000000;
    --topbar-bg: rgba(11, 18, 32, .9);
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background: var(--bg);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1 { margin: 0 0 18px; font-weight: 750; letter-spacing: -.01em; }
  p { margin: 0 0 10px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 20px;
    background: var(--topbar-bg);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .brand { color: var(--ink); font-weight: 800; text-decoration: none; letter-spacing: -.01em; }
  .topbar nav { display: flex; align-items: center; gap: 18px; font-size: .92rem; }
  .topbar .soon { color: var(--link); font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--tint-teal); }

  .theme-toggle {
    margin: 0; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 999px;
    background: var(--surface); color: var(--muted); font-size: .9rem; line-height: 1;
    cursor: pointer;
  }
  .theme-toggle .moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .moon { display: inline; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .sun { display: none; }
    :root:not([data-theme="light"]) .theme-toggle .moon { display: inline; }
  }

  .app-shell {
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
    padding: 28px 0 80px;
  }

  .hero-split {
    display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: 48px; align-items: center; padding-top: 8vh;
  }
  @media (max-width: 900px) { .hero-split { grid-template-columns: 1fr; gap: 28px; padding-top: 3vh; } }

  .hero { max-width: 560px; }
  .hero h1 { font-size: clamp(2.4rem, 5.2vw, 4.2rem); line-height: 1.15; }
  .lede { color: var(--muted); font-size: 1.2rem; line-height: 1.6; margin-bottom: 26px; }

  .button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 10px;
    padding: 11px 18px;
    color: var(--on-primary); background: var(--primary);
    font: inherit; font-weight: 700;
    text-decoration: none; cursor: pointer;
    transition: filter .12s ease;
  }
  .button:hover { filter: brightness(1.06); }
  .note { margin-top: 12px; color: var(--muted); font-size: .88rem; }

  .demo { margin: 0; }
  .demo video {
    display: block; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 14px; background: var(--video-bg);
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .demo figcaption { margin-top: 10px; color: var(--muted); font-size: .88rem; }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Omini Studio</a>
    <nav>
      <span class="soon">Coming soon</span>
      <button type="button" class="theme-toggle" title="Switch light / dark" aria-label="Switch colour scheme">
        <span class="sun">&#9728;</span><span class="moon">&#9790;</span>
      </button>
    </nav>
  </header>

  <main class="app-shell">
    <section class="hero-split">
      <div class="hero">
        <h1>Turn your audio into a finished explainer video.</h1>
        <p class="lede">
          Upload narration, describe the result, review the draft, and approve the final.
        </p>
        <a class="button" href="mailto:eze@injectflow.com?subject=Notify%20me%20when%20Omini%20Studio%20launches">Get notified at launch</a>
        <p class="note">One email when we open the doors. Nothing else.</p>
      </div>
      <figure class="demo">
        <video controls preload="metadata" poster="demo-poster.jpg" src="demo.mp4"></video>
        <figcaption>Made from a two-minute voice note. Every scene is planned from the words and timed to them.</figcaption>
      </figure>
    </section>
  </main>

  <script>
    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var dark = root.getAttribute("data-theme")
        ? root.getAttribute("data-theme") === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      var next = dark ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  </script>
</body>
</html>
